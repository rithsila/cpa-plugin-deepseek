name: release

# Cut a release by pushing a tag: git tag v0.1.0 && git push origin v0.1.0
#
# The platform matrix is read from platforms.txt, the same file
# scripts/package-release.sh and build.sh validate against, so the pipeline and
# the local scripts cannot disagree about which platforms exist.
on:
  push:
    tags: ["v*"]
  # Test the matrix without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (no leading v)
        required: true
        default: "0.0.0-matrix"

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.parse.outputs.include }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: parse
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
            registry_version="$(python3 -c 'import json; print(json.load(open("registry.json"))["plugins"][0]["version"])')"
            if [ "$registry_version" != "$version" ]; then
              echo "registry.json version (${registry_version}) does not match the release tag (${version})" >&2
              echo "bump registry.json before tagging" >&2
              exit 1
            fi
          fi
          # The matrix comes from platforms.txt through the same helper the local
          # scripts use, so the comment-stripping rule lives in one place.
          include="$(source scripts/platforms.sh && platforms_entries \
            | awk '{ printf "{\"target\":\"%s\",\"runner\":\"%s\",\"toolchain\":\"%s\"}\n", $1, $2, $3 }' \
            | jq -s -c '.')"
          {
            echo "include=${include}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: select mingw64 gcc
        if: matrix.toolchain == 'msys2-mingw64'
        shell: bash
        run: |
          echo "C:/msys64/mingw64/bin" >> "$GITHUB_PATH"
          echo "CC=gcc" >> "$GITHUB_ENV"
      - name: install llvm-mingw (windows/arm64 cross toolchain)
        if: matrix.toolchain == 'llvm-mingw'
        shell: bash
        run: |
          set -euo pipefail
          name=llvm-mingw-20261006-ucrt-x86_64
          curl -sSL -o "$RUNNER_TEMP/${name}.zip" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/${name}.zip"
          unzip -q "$RUNNER_TEMP/${name}.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${name}/bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-clang" >> "$GITHUB_ENV"
      - name: build and package
        if: matrix.toolchain != 'freebsd-vm'
        shell: bash
        run: ./scripts/package-release.sh "${{ needs.matrix.outputs.version }}" "${{ matrix.target }}"
      - name: build and package (inside the FreeBSD VM)
        if: matrix.toolchain == 'freebsd-vm'
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          # sync expects a method name, not a boolean.
          sync: rsync
          prepare: pkg install -y go python3
          envs: VERSION,TARGET
          run: ./scripts/package-release.sh "$VERSION" "$TARGET"
        env:
          VERSION: ${{ needs.matrix.outputs.version }}
          TARGET: ${{ matrix.target }}
      - name: check artefacts against the plugin-store contract
        shell: bash
        run: |
          "$(command -v python3 || command -v python)" test/package_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ strategy.job-index }}
          path: dist/*.zip

  publish:
    needs: [matrix, build]
    # A manual run only validates the matrix; it must not publish anything.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: write checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
